name: Deploy to Vietnix Production

on:
  push:
    branches:
      - main # Chạy tự động khi push hoặc merge vào main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay

# Khi có commit mới, tự động hủy bỏ lần deploy cũ đang chạy để ưu tiên deploy bản mới nhất
concurrency:
  group: production-vietnix
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to FTPS Server
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # So sánh diff 2 commit gần nhất để upload đúng file thay đổi

      - name: 🚀 Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          dangerous-clean-slate: false # BẮT BUỘC false: Không xóa file có sẵn trên server
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config.local.php
            uploads/**
            .htaccess
            README.md
            *.md
            install.sql
            *.zip
            *.tar.gz
            error_log
            */error_log
            *.log
            *.bak
            .ftpquota
